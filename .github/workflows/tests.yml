name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly, includes the slow suite

jobs:
  fast:
    name: fast / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        experimental: [false]
        include:
          - {os: ubuntu-latest, python: "3.13", experimental: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  minimum-versions:
    name: fast + slow / minimum dependency versions / py3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install tomli
      - run: python ci/minimum_constraints.py > constraints-min.txt
      - run: python -m pip install -e ".[dev]" -c constraints-min.txt
      - run: python -m pip list
      - run: python -m pytest
      - run: python -m pytest -m slow

  slow:
    name: slow / ${{ matrix.os }} / py3.12
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m slow
