name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly, includes the slow suite

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.3  # pinned: new ruff releases add rules
      - run: python -m ruff check .
      - run: python ci/release.py --check  # __init__.py, CITATION.cff and CHANGELOG.md agree

  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned mypy, and dependencies from the lock: new releases of either change what mypy reports.
      - run: python -m pip install -e . mypy==2.4.1 -c requirements.txt
      - run: python -m mypy  # settings in pyproject.toml

  coverage:
    name: coverage / ubuntu / py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pytest-cov pytest-github-actions-annotate-failures==0.4.2  # failing tests become annotations, readable without signing in
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  fast:
    name: fast / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures==0.4.2
      - run: python -m pytest

  minimum-versions:
    name: fast + slow / minimum dependency versions / py3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install tomli
      - run: python ci/minimum_constraints.py > constraints-min.txt
      - run: python -m pip install -e ".[dev]" -c constraints-min.txt
      - run: python -m pip install pytest-github-actions-annotate-failures==0.4.2
      - run: python -m pip list
      - run: python -m pytest
      - run: python -m pytest -m slow

  slow:
    name: slow / ${{ matrix.os }} / py3.12
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures==0.4.2
      - run: python -m pytest -m slow
