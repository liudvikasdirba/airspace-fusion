[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airspace-fusion"
version = "0.1.0"
description = "Simulation-only single-object multi-sensor tracking demonstrator (educational prototype)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Liudvikas"}]
# Tested on 3.10.7 and 3.12.10 (3.12+ recommended).
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.1",  # 1.11.0 was yanked from PyPI
    "pydantic>=2.6",
    "stonesoup>=1.4",
    "plotly>=5.20",
    "streamlit>=1.49",  # first release whose st.button accepts width=
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
airspace-fusion = "airspace_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: Monte Carlo and sweep tests (run with -m slow)"]
filterwarnings = ["error::DeprecationWarning:airspace_fusion", "error::RuntimeWarning:airspace_fusion"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit so results do not shift with ruff's default rule set. B905 (zip strict=) is left off on purpose.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]

[tool.coverage.run]
source = ["airspace_fusion"]
branch = true
